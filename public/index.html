<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>POLYARB v11</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ═══════════════════════════════════════════════════════════════
   POLYARB v11 — Arbitrage mécanique par marché unique
   ═══════════════════════════════════════════════════════════════
   [v11] Suppression complète de la corrélation inter-marchés (modèle bayésien,
   paires, décalage causal, N effectif...). Remplacée par un signal purement
   mécanique : sur chaque marché binaire, le jeton OUI et le jeton NON paient
   ensemble exactement $1 à la résolution. Si les acheter coûte moins que ça
   net de frais, le profit est garanti — aucune prédiction, aucune paire,
   aucun test statistique. Le moteur tourne côté serveur (index.js + engine.js),
   ce fichier n'est qu'un tableau de bord qui interroge /bot-state.
   ═══════════════════════════════════════════════════════════════ */

const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));

const DEFAULT_CFG = {
  minEdge: 0.03, feeBps: 200, maxPct: 0.05,
  maxDaily: 20, cooldown: 45000, maxExposure: 0.25,
  refreshMs: 15000, autoExec: 0, bankroll: 2000,
};

// ─── STORE — poll de l'état serveur (le moteur tourne côté backend) ────────
function useStore() {
  const [cfg,setCfgLocal]        = useState(DEFAULT_CFG);
  const [bankroll,setBankroll]   = useState(DEFAULT_CFG.bankroll);
  const [startBr,setStartBr]     = useState(DEFAULT_CFG.bankroll);
  const [markets,setMarkets]     = useState([]);
  const [positions,setPositions] = useState([]);
  const [logs,setLogs]           = useState([]);
  const [metrics,setMetrics]     = useState({pnl:0,winRate:0,sharpe:0,trades:0});
  const [apiSt,setApiSt]         = useState({gamma:"boot",clob:"boot"});
  const [discovering,setDiscovering] = useState(false);
  const [tab,setTab]             = useState("pos");

  useEffect(()=>{
    let alive = true;
    async function poll() {
      try {
        const r = await fetch('/bot-state');
        if (!r.ok || !alive) return;
        const s = await r.json();
        if (!alive) return;
        if (s.cfg) setCfgLocal(s.cfg);
        setMarkets(s.markets ?? []);
        setPositions(s.positions ?? []);
        if (typeof s.bankroll === "number") setBankroll(s.bankroll);
        if (typeof s.startBr === "number") setStartBr(s.startBr);
        if (s.metrics) setMetrics(s.metrics);
        if (s.apiSt) setApiSt(s.apiSt);
        setDiscovering(!!s.discovering);
        setLogs(s.logs ?? []);
      } catch {}
    }
    poll();
    const t = setInterval(poll, 5000);
    return () => { alive = false; clearInterval(t); };
  },[]);

  const setCfg = useCallback((updater)=>{
    setCfgLocal(prev=>{
      const next = typeof updater === "function" ? updater(prev) : updater;
      fetch('/bot-cfg', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(next) }).catch(()=>{});
      return next;
    });
  },[]);

  const execute = useCallback((marketId)=>{
    fetch('/bot-exec', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({marketId}) }).catch(()=>{});
  },[]);

  const closePos = useCallback((posId)=>{
    fetch('/bot-close', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({posId}) }).catch(()=>{});
  },[]);

  const discover = useCallback(()=>{
    setDiscovering(true);
    fetch('/bot-discover', { method:'POST' }).catch(()=>{});
  },[]);

  const currentExposure = useCallback(()=>{
    return positions.filter(p=>p.status==="OPEN").reduce((s,p)=>s+p.size,0);
  },[positions]);

  return{cfg,setCfg,bankroll,startBr,markets,positions,logs,metrics,apiSt,tab,setTab,
         discovering,execute,closePos,discover,currentExposure};
}

// ─── UI ─────────────────────────────────────────────────────────
const CLR={
  bg0:"#030b12",bg1:"#050f18",bg2:"#071520",
  line:"#0a1e2e",line2:"#0e2d43",
  amber:"#ffb300",amberD:"rgba(255,179,0,.12)",
  green:"#00e676",greenD:"rgba(0,230,118,.1)",
  red:"#ff3d5a",redD:"rgba(255,61,90,.1)",
  cyan:"#00cfff",cyanD:"rgba(0,207,255,.08)",
  violet:"#ce93d8",violetD:"rgba(206,147,216,.08)",
  orange:"#ff9800",orangeD:"rgba(255,152,0,.08)",
  txt:"#4d7f99",txt2:"#7aafc4",txt3:"#b8d4e0",
  muted:"#1e4d66",
};

function Badge({color,children}){
  return<span style={{fontSize:8,padding:"1px 5px",borderRadius:2,fontWeight:700,letterSpacing:.8,border:`1px solid ${color}`,color}}>{children}</span>;
}
function Stat({label,value,color,tiny}){
  return(
    <div style={{display:"flex",flexDirection:"column",gap:1,minWidth:tiny?30:42}}>
      <div style={{fontSize:7,color:CLR.muted,letterSpacing:.8}}>{label}</div>
      <div style={{fontSize:tiny?9:11,fontWeight:700,color:color??CLR.txt2,fontFamily:"'Barlow Condensed',sans-serif",lineHeight:1}}>{value}</div>
    </div>
  );
}

function MarketRow({m,onExec}){
  const ready = m.arb?.valid && m.sizeUSDC >= 1;
  return(
    <div style={{borderBottom:`1px solid ${CLR.line}`,padding:"8px 10px",background:ready?CLR.greenD:"transparent",opacity:m.closed?0.5:1}}>
      <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:4}}>
        <span style={{fontSize:10,minWidth:18}}>{m.emoji}</span>
        <span style={{fontSize:8,color:CLR.muted,letterSpacing:1}}>{m.category}</span>
        {m.closed && <Badge color={CLR.muted}>RÉSOLU</Badge>}
      </div>
      <div style={{fontSize:9,color:CLR.txt3,marginBottom:5,lineHeight:1.4}}>{m.title}</div>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <Stat label="OUI"   value={m.arb?.askYes!=null?`${(m.arb.askYes*100).toFixed(1)}¢`:"–"} color={CLR.cyan} tiny/>
        <Stat label="NON"   value={m.arb?.askNo!=null?`${(m.arb.askNo*100).toFixed(1)}¢`:"–"}   color={CLR.txt2} tiny/>
        <Stat label="COÛT"  value={m.arb?.cost!=null?`${(m.arb.cost*100).toFixed(1)}¢`:"–"}      color={CLR.txt}/>
        <Stat label="EDGE"  value={m.arb?.edge!=null?`${(m.arb.edge*100).toFixed(1)}%`:"–"}      color={m.arb?.valid?CLR.green:CLR.muted}/>
        <Stat label="TAILLE" value={`$${m.sizeUSDC.toFixed(0)}`}                                  color={CLR.amber}/>
        <div style={{marginLeft:"auto"}}>
          {ready
            ?<button onClick={()=>onExec(m.id)} style={{background:CLR.greenD,border:`1px solid ${CLR.green}`,color:CLR.green,padding:"3px 10px",fontSize:9,fontWeight:700,letterSpacing:1,cursor:"pointer",borderRadius:2,fontFamily:"inherit"}}>ARB ✓</button>
            :<button disabled title={m.arb?.reason} style={{background:"transparent",border:`1px solid ${CLR.muted}`,color:CLR.muted,padding:"3px 10px",fontSize:8,cursor:"default",borderRadius:2,fontFamily:"inherit",opacity:.5}}>{m.arb?.reason||"WAIT"}</button>
          }
        </div>
      </div>
    </div>
  );
}

const FILTER_OPTS=[{id:"all",label:"TOUS"},{id:"valid",label:"ARB VALIDE"}];
const SORT_OPTS=[{id:"edge",label:"Edge↓"},{id:"volume",label:"Volume↓"}];
function ScannerControls({filter,setFilter,sort,setSort,total,visible}){
  return(
    <div style={{padding:"5px 10px",borderBottom:`1px solid ${CLR.line}`,display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",flexShrink:0}}>
      {FILTER_OPTS.map(f=>(
        <button key={f.id} onClick={()=>setFilter(f.id)} style={{padding:"2px 7px",fontSize:7,fontWeight:700,letterSpacing:.8,cursor:"pointer",borderRadius:2,fontFamily:"inherit",
          background:filter===f.id?CLR.amberD:"transparent",border:`1px solid ${filter===f.id?CLR.amber:CLR.muted}`,color:filter===f.id?CLR.amber:CLR.muted}}>{f.label}</button>
      ))}
      <div style={{marginLeft:"auto",display:"flex",gap:4,alignItems:"center"}}>
        <span style={{fontSize:7,color:CLR.muted}}>{visible}/{total}</span>
        <select value={sort} onChange={e=>setSort(e.target.value)}
          style={{background:CLR.bg2,border:`1px solid ${CLR.line2}`,color:CLR.txt2,fontSize:7,padding:"2px 4px",borderRadius:2,fontFamily:"inherit",cursor:"pointer",outline:"none"}}>
          {SORT_OPTS.map(o=><option key={o.id} value={o.id}>{o.label}</option>)}
        </select>
      </div>
    </div>
  );
}
function applyFilterSort(markets,filter,sort){
  let out=[...markets];
  if(filter==="valid") out=out.filter(m=>m.arb?.valid);
  if(sort==="edge") out.sort((a,b)=>(b.arb?.edge??-1)-(a.arb?.edge??-1));
  else if(sort==="volume") out.sort((a,b)=>b.volume24h-a.volume24h);
  return out;
}

function PosRow({pos,onClose}){
  const pnl=pos.pnlUSDC??0, isOpen=pos.status==="OPEN";
  return(
    <div style={{borderBottom:`1px solid ${CLR.line}`,padding:"6px 10px",background:isOpen?CLR.cyanD:"transparent"}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
        <Badge color={pos.mode==="LIVE"?CLR.green:CLR.amber}>{pos.mode}</Badge>
        <Badge color={isOpen?CLR.cyan:CLR.muted}>{pos.status}</Badge>
        <span style={{fontSize:8,color:CLR.txt2,flex:1,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{pos.label}</span>
        <span style={{fontSize:12,fontWeight:700,color:pnl>=0?CLR.green:CLR.red,fontFamily:"'Barlow Condensed',sans-serif"}}>
          {pnl>=0?"+":""}${pnl.toFixed(2)}
        </span>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <Stat label="COÛT" value={`${(pos.cost*100).toFixed(1)}¢`} color={CLR.txt}/>
        <Stat label="EDGE" value={`${(pos.edge*100).toFixed(1)}%`} color={CLR.amber}/>
        <Stat label="MISE" value={`$${pos.size.toFixed(0)}`}       color={CLR.txt}/>
        {isOpen&&<span style={{fontSize:7,color:CLR.muted}}>en attente de résolution</span>}
        <div style={{marginLeft:"auto",fontSize:7,color:CLR.muted}}>{pos.ts.slice(0,16).replace("T"," ")}</div>
        {isOpen&&<button onClick={()=>onClose(pos.id)} style={{background:CLR.redD,border:`1px solid ${CLR.red}`,color:CLR.red,padding:"2px 8px",fontSize:8,cursor:"pointer",borderRadius:2,fontFamily:"inherit",fontWeight:700}}>CLOSE</button>}
      </div>
    </div>
  );
}

function LogRow({e}){
  const colors={SYS:CLR.muted,DISC:CLR.cyan,SIG:CLR.amber,ORDER:CLR.green,CLOSE:CLR.violet,RISK:CLR.red,WARN:CLR.amber,ERR:CLR.red,EXEC:CLR.green,SETTLE:CLR.cyan};
  return(
    <div style={{padding:"2px 10px",borderBottom:`1px solid ${CLR.line}`,display:"flex",gap:8}}>
      <span style={{fontSize:8,color:CLR.muted,flexShrink:0}}>{e.ts}</span>
      <span style={{fontSize:8,fontWeight:700,color:colors[e.kind]??CLR.txt,flexShrink:0,minWidth:38}}>{e.kind}</span>
      <span style={{fontSize:8,color:CLR.txt2,lineHeight:1.4,wordBreak:"break-word"}}>{e.msg}</span>
    </div>
  );
}

function ConfigPanel({cfg,setCfg,onDiscover,discovering}){
  const row=(key,label,min,max,step,fmt)=>(
    <div style={{marginBottom:8}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}>
        <span style={{fontSize:7,color:CLR.muted,letterSpacing:.8}}>{label}</span>
        <span style={{fontSize:9,fontWeight:700,color:CLR.amber}}>{fmt(cfg[key])}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={cfg[key]}
        onChange={e=>setCfg(c=>({...c,[key]:parseFloat(e.target.value)}))}
        style={{width:"100%",accentColor:CLR.amber,cursor:"pointer"}}/>
    </div>
  );
  const toggle=(key,label)=>(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
      <span style={{fontSize:8,color:CLR.txt2}}>{label}</span>
      <button onClick={()=>setCfg(c=>({...c,[key]:c[key]?0:1}))}
        style={{padding:"2px 10px",fontSize:8,fontWeight:700,borderRadius:2,fontFamily:"inherit",cursor:"pointer",
          background:cfg[key]?CLR.greenD:"transparent",border:`1px solid ${cfg[key]?CLR.green:CLR.muted}`,color:cfg[key]?CLR.green:CLR.muted}}>
        {cfg[key]?"ON":"OFF"}
      </button>
    </div>
  );
  return(
    <div style={{padding:12,overflowY:"auto"}}>
      <div style={{fontSize:8,color:CLR.cyan,letterSpacing:2,marginBottom:10,fontWeight:700}}>ARBITRAGE OUI+NON</div>
      {row("minEdge","EDGE MINIMUM (net de frais)",0.01,0.20,0.01,v=>`${(v*100).toFixed(0)}%`)}
      {row("feeBps","COÛT ROUND-TRIP (frais+gas)",0,500,10,v=>`${(v/100).toFixed(2)}%`)}
      {row("maxPct","TAILLE MAX PAR ARB",0.01,0.20,0.01,v=>`${(v*100).toFixed(0)}%`)}

      <div style={{fontSize:8,color:CLR.amber,letterSpacing:2,marginBottom:10,marginTop:14,fontWeight:700}}>RISQUE & EXÉCUTION</div>
      {toggle("autoExec","AUTO-EXECUTE")}
      {row("maxDaily","TRADES MAX / JOUR",1,50,1,v=>v)}
      {row("maxExposure","EXPOSITION MAX",0.05,1.0,0.05,v=>`${(v*100).toFixed(0)}%`)}
      {row("cooldown","COOLDOWN PAR MARCHÉ",5000,180000,5000,v=>`${Math.round(v/1000)}s`)}

      <button onClick={onDiscover} disabled={discovering} style={{marginTop:14,width:"100%",background:CLR.cyanD,border:`1px solid ${CLR.cyan}`,color:discovering?CLR.muted:CLR.cyan,padding:"7px",fontSize:9,fontWeight:700,letterSpacing:1,cursor:discovering?"default":"pointer",borderRadius:2,fontFamily:"inherit"}}>
        {discovering?"SCAN EN COURS…":"REDÉCOUVRIR MARCHÉS"}
      </button>

      <div style={{marginTop:16,padding:"8px 10px",background:"rgba(0,207,255,.05)",border:"1px solid rgba(0,207,255,.25)",borderRadius:2,fontSize:7,color:CLR.txt2,lineHeight:1.6}}>
        <b style={{color:CLR.cyan}}>ℹ COMMENT ÇA MARCHE</b><br/>
        Chaque marché binaire a 2 jetons (OUI/NON) qui paient $1 ensemble à la résolution.
        Si les acheter coûte moins de $1 net de frais, le profit est garanti — pas de
        prédiction, pas de corrélation entre marchés. La position reste ouverte jusqu'à
        la résolution (pas de stop-loss/take-profit : aucun risque de prix résiduel une
        fois les deux jambes exécutées — seulement un risque d'exécution partielle en
        mode live si une seule des deux jambes se remplit).
      </div>
    </div>
  );
}

// ─── STYLES ───────────────────────────────────────────────────
const STYLES=`
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Barlow+Condensed:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;}
body{background:#030b12;font-family:'JetBrains Mono',monospace;font-size:11px;color:#4d7f99;overflow:hidden;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:#0e2d43;border-radius:2px;}
@keyframes blk{0%,100%{opacity:1}50%{opacity:.2}}
input[type=range]{height:2px;cursor:pointer;appearance:auto;}
button:focus{outline:none;}
select:focus{outline:none;}
`;

// ─── APP ──────────────────────────────────────────────────────
function PolyArb() {
  const store=useStore();
  const{cfg,setCfg,bankroll,startBr,markets,positions,logs,metrics,apiSt,tab,setTab,
        discovering,execute,closePos,discover,currentExposure}=store;

  const [scanFilter,setScanFilter]=useState("all");
  const [scanSort,setScanSort]=useState("edge");

  useEffect(()=>{
    const s=document.createElement("style");
    s.textContent=STYLES;
    document.head.appendChild(s);
    return()=>document.head.removeChild(s);
  },[]);

  const openPos=positions.filter(p=>p.status==="OPEN");
  const closedPos=positions.filter(p=>p.status==="CLOSED");
  const validArb=markets.filter(m=>m.arb?.valid).length;
  const visibleMarkets=applyFilterSort(markets,scanFilter,scanSort);
  const expoUSDC=currentExposure();
  const expoPct=bankroll>0?expoUSDC/bankroll:0;
  const sessionPnl=bankroll-startBr;

  return(
    <div style={{display:"grid",gridTemplateRows:"46px 22px 1fr",height:"100vh",background:CLR.bg0}}>

      {/* TOP BAR */}
      <div style={{background:CLR.bg2,borderBottom:`1px solid ${CLR.line2}`,display:"flex",alignItems:"center",padding:"0 14px",gap:16,position:"relative",overflow:"hidden",flexShrink:0}}>
        <div style={{position:"absolute",bottom:0,left:0,right:0,height:1,background:`linear-gradient(90deg,transparent,${CLR.amber} 25%,${CLR.cyan} 75%,transparent)`,opacity:.35}}/>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:800,letterSpacing:5,color:CLR.amber,flexShrink:0}}>
          POLY<span style={{color:CLR.cyan}}>ARB</span><sup style={{fontSize:9,color:CLR.green,marginLeft:2,fontWeight:600}}>v11</sup>
        </div>
        <div style={{fontSize:7,color:CLR.muted,letterSpacing:2,lineHeight:1.4}}>MECHANICAL<br/>ARBITRAGE</div>
        <div style={{display:"flex",gap:1,marginLeft:"auto",height:"100%"}}>
          {[
            {l:"BANKROLL", v:`$${bankroll.toFixed(0)}`,                                    c:CLR.amber},
            {l:"PnL",      v:`${sessionPnl>=0?"+":""}$${sessionPnl.toFixed(2)}`,           c:sessionPnl>=0?CLR.green:CLR.red},
            {l:"WIN",      v:`${(metrics.winRate*100).toFixed(0)}%`,                        c:metrics.winRate>=0.5?CLR.green:CLR.txt},
            {l:"SHARPE",   v:metrics.sharpe.toFixed(2),                                     c:metrics.sharpe>=1?CLR.green:metrics.sharpe>=0?CLR.amber:CLR.red},
            {l:"EXPO",     v:`${(expoPct*100).toFixed(0)}%`,                                c:expoPct>cfg.maxExposure*0.8?CLR.red:CLR.muted},
            {l:"ARB VALIDE", v:validArb,                                                    c:validArb>0?CLR.green:CLR.muted},
          ].map(({l,v,c})=>(
            <div key={l} style={{padding:"0 9px",display:"flex",flexDirection:"column",justifyContent:"center",borderLeft:`1px solid ${CLR.line}`,minWidth:54}}>
              <div style={{fontSize:7,color:CLR.muted,letterSpacing:1.2,marginBottom:2,textTransform:"uppercase"}}>{l}</div>
              <div style={{fontSize:13,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif",color:c,lineHeight:1}}>{v}</div>
            </div>
          ))}
        </div>
      </div>

      {/* INFO BANNER */}
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 14px",
        background:"rgba(0,207,255,.04)",borderBottom:"1px solid rgba(0,207,255,.15)"}}>
        <span style={{fontSize:8,fontWeight:700,letterSpacing:2,color:CLR.cyan,animation:"blk 2s ease infinite"}}>● ACTIF</span>
        <span style={{fontSize:7,color:CLR.muted}}>Arbitrage OUI+NON — mécanique, sans corrélation ni prédiction</span>
        <span style={{marginLeft:"auto",fontSize:7,color:CLR.muted}}>
          Gamma: <span style={{color:apiSt.gamma==="ok"?CLR.green:CLR.amber}}>{apiSt.gamma.toUpperCase()}</span>
          {" "}CLOB: <span style={{color:apiSt.clob==="ok"?CLR.green:CLR.amber}}>{apiSt.clob.toUpperCase()}</span>
          {" "}| {markets.length} marchés | {openPos.length} ouv | expo ${expoUSDC.toFixed(0)}
        </span>
      </div>

      {/* MAIN GRID */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 320px",gap:1,background:CLR.line,minHeight:0,overflow:"hidden"}}>

        {/* LEFT: SCANNER */}
        <div style={{background:CLR.bg1,display:"flex",flexDirection:"column",minHeight:0}}>
          <div style={{padding:"5px 10px",borderBottom:`1px solid ${CLR.line}`,display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
            <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,fontWeight:700,letterSpacing:2,color:CLR.amber}}>SCANNER</span>
            {discovering&&<span style={{fontSize:7,color:CLR.cyan,animation:"blk 1s ease infinite"}}>DISCOVERING…</span>}
            <span style={{marginLeft:"auto",fontSize:7,color:CLR.muted}}>{markets.length} marchés binaires suivis</span>
          </div>
          <ScannerControls filter={scanFilter} setFilter={setScanFilter} sort={scanSort} setSort={setScanSort} total={markets.length} visible={visibleMarkets.length}/>
          <div style={{overflowY:"auto",flex:1}}>
            {markets.length===0
              ?<div style={{padding:24,color:CLR.muted,fontSize:9,textAlign:"center",lineHeight:1.8}}>
                Découverte des marchés…<br/>
                <span style={{fontSize:7}}>Scan des marchés binaires Polymarket</span>
              </div>
              :visibleMarkets.length===0
              ?<div style={{padding:20,color:CLR.muted,fontSize:9,textAlign:"center"}}>Aucun marché pour ce filtre.</div>
              :visibleMarkets.map(m=>(<MarketRow key={m.id} m={m} onExec={execute}/>))
            }
          </div>
        </div>

        {/* RIGHT: TABS */}
        <div style={{background:CLR.bg1,display:"flex",flexDirection:"column",minHeight:0}}>
          <div style={{display:"flex",borderBottom:`1px solid ${CLR.line}`,flexShrink:0}}>
            {[
              {id:"pos",  label:`POS(${openPos.length})`},
              {id:"hist", label:`HIST(${closedPos.length})`},
              {id:"log",  label:"LOG"},
              {id:"cfg",  label:"CFG"},
            ].map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{
                flex:1,padding:"6px 1px",fontSize:7,fontWeight:700,letterSpacing:.4,
                background:tab===t.id?CLR.amberD:"transparent",
                color:tab===t.id?CLR.amber:CLR.muted,
                border:"none",borderRight:`1px solid ${CLR.line}`,
                cursor:"pointer",fontFamily:"inherit",
              }}>{t.label}</button>
            ))}
          </div>
          <div style={{overflowY:"auto",flex:1}}>
            {tab==="pos"&&(openPos.length===0
              ?<div style={{padding:16,color:CLR.muted,fontSize:8,textAlign:"center"}}>Aucune position ouverte</div>
              :openPos.map(p=><PosRow key={p.id} pos={p} onClose={closePos}/>)
            )}
            {tab==="hist"&&(closedPos.length===0
              ?<div style={{padding:16,color:CLR.muted,fontSize:8,textAlign:"center"}}>Aucun historique</div>
              :[...closedPos].reverse().map(p=><PosRow key={p.id} pos={p} onClose={()=>{}}/>)
            )}
            {tab==="log"&&(logs.length===0
              ?<div style={{padding:16,color:CLR.muted,fontSize:8}}>En attente…</div>
              :[...logs].reverse().map(e=><LogRow key={e.id} e={e}/>)
            )}
            {tab==="cfg"&&<ConfigPanel cfg={cfg} setCfg={setCfg} onDiscover={discover} discovering={discovering}/>}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PolyArb />);
  </script>
</body>
</html>
